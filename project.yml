name: LangSale
options:
  bundleIdPrefix: com.langsale
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  LangSaleKit:
    path: .
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    # Bump on every commit that ships (see docs/ARCHITECTURE.md, Production releases).
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple developer team ID here or in Xcode's Signing settings.
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"

targets:
  LangSale:
    type: application
    platform: iOS
    sources:
      - path: LangSaleApp
    dependencies:
      - package: LangSaleKit
        product: LangSaleCore
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.langsale.app
        PRODUCT_NAME: LangSale
        INFOPLIST_FILE: LangSaleApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LangSaleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LangSaleAppTests
    dependencies:
      - target: LangSale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.langsale.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LangSale.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LangSale"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LangSaleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LangSaleUITests
    dependencies:
      - target: LangSale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.langsale.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LangSale

schemes:
  LangSale:
    build:
      targets:
        LangSale: all
        LangSaleTests: [test]
        LangSaleUITests: [test]
    test:
      config: Debug
      targets:
        - LangSaleTests
        - LangSaleUITests
